<!DOCTYPE html>
<html>
<head>
    <title>Ring Runner X - Precision</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: 'Orbitron', sans-serif; }
        #ui-container {
            position: absolute;
            top: 35px;
            left: 35px;
            pointer-events: none;
            color: white;
        }
        #ui { font-size: 36px; font-weight: 900; letter-spacing: 4px; color: #fff; text-shadow: 0 0 15px #ff0055; }
        #combo { color: #ff0055; font-size: 14px; margin-top: 5px; font-weight: bold; letter-spacing: 2px; }
        #gameOver {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            text-align: center;
            display: none;
            background: #000;
            padding: 60px;
            border: 1px solid #ff0055;
            box-shadow: 0 0 50px rgba(255, 0, 85, 0.3);
            cursor: pointer;
            z-index: 100;
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@900&display=swap" rel="stylesheet">
</head>
<body>

    <div id="ui-container">
        <div id="ui">0000</div>
        <div id="combo">COMBO X1</div>
    </div>

    <div id="gameOver" onclick="location.reload()">
        <h1 style="font-size: 48px; margin: 0; letter-spacing: 10px;">FATAL ERROR</h1>
        <div id="finalScore" style="margin: 20px 0; font-size: 24px; color: #ff0055;"></div>
        <p>REBOOT SYSTEM</p>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/three@0.155.0/build/three.min.js"></script>

    <script>
        let scene = new THREE.Scene();
        scene.fog = new THREE.Fog(0x000000, 40, 180);

        let camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        let renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.body.appendChild(renderer.domElement);

        // --- IMPROVED GRID (Hyper-Reflective Floor) ---
        const floorGroup = new THREE.Group();
        
        // Dark Mirrored Surface
        const floorGeo = new THREE.PlaneGeometry(1000, 1000);
        const floorMat = new THREE.MeshStandardMaterial({ 
            color: 0x050505, 
            roughness: 0.1, 
            metalness: 0.8 
        });
        const floor = new THREE.Mesh(floorGeo, floorMat);
        floor.rotation.x = -Math.PI / 2;
        floorGroup.add(floor);

        // Glowing Grid Overlay
        const gridLines = new THREE.GridHelper(1000, 120, 0xff0055, 0x330011);
        gridLines.position.y = 0.02; // Slightly above floor to prevent flickering
        floorGroup.add(gridLines);
        
        scene.add(floorGroup);

        // --- THE MACHINED CORE (NEW BALL) ---
        const ballGroup = new THREE.Group();
        
        // Inner Machined Metal
        const core = new THREE.Mesh(
            new THREE.SphereGeometry(0.4, 32, 32),
            new THREE.MeshStandardMaterial({ color: 0x111111, metalness: 1, roughness: 0.1 })
        );
        
        // Outer Energy Shell
        const shell = new THREE.Mesh(
            new THREE.SphereGeometry(0.55, 32, 32),
            new THREE.MeshPhongMaterial({ 
                color: 0xff0055, 
                transparent: true, 
                opacity: 0.3, 
                shininess: 100 
            })
        );
        
        ballGroup.add(core);
        ballGroup.add(shell);
        ballGroup.position.y = 0.6;
        scene.add(ballGroup);

        // Lighting for Metal Reflections
        const topLight = new THREE.DirectionalLight(0xffffff, 2);
        topLight.position.set(0, 20, 10);
        scene.add(topLight);
        
        const sideLight = new THREE.PointLight(0xff0055, 5, 20);
        scene.add(sideLight);

        // Sparkles (Digital Fragments)
        const particles = [];
        for(let i=0; i<40; i++) {
            const p = new THREE.Mesh(new THREE.BoxGeometry(0.15, 0.15, 0.15), new THREE.MeshBasicMaterial({ color: 0xffffff }));
            p.visible = false;
            scene.add(p);
            particles.push(p);
        }

        function triggerSparkles(pos) {
            particles.forEach(p => {
                p.visible = true;
                p.position.copy(pos);
                p.userData.vel = new THREE.Vector3((Math.random()-0.5)*1.2, (Math.random()-0.5)*1.2, (Math.random()-0.5)*1.2);
                p.scale.setScalar(2);
            });
        }

        // Tech Rings (Kept as requested)
        let rings = [];
        function createRing(z) {
            const group = new THREE.Group();
            const mesh = new THREE.Mesh(
                new THREE.TorusGeometry(2.2, 0.15, 6, 6),
                new THREE.MeshStandardMaterial({ color: 0x111111, metalness: 1, emissive: 0xff0055, emissiveIntensity: 0.2 })
            );
            const glow = new THREE.Mesh(
                new THREE.TorusGeometry(2.2, 0.03, 8, 50),
                new THREE.MeshBasicMaterial({ color: 0xff0055 })
            );
            group.add(mesh, glow);
            group.position.set((Math.random() - 0.5) * 15, 2.5, z);
            group.userData = { passed: false };
            scene.add(group);
            rings.push(group);
        }

        for (let i = 0; i < 10; i++) createRing(-i * 35 - 50);

        let score = 0, combo = 1, speed = 0.5, mouseX = 0, gameOver = false;

        window.addEventListener("mousemove", e => { mouseX = (e.clientX / window.innerWidth) * 2 - 1; });

        function animate() {
            if (gameOver) return;
            requestAnimationFrame(animate);

            // Ball & Shell Pulse
            const targetX = mouseX * 9;
            ballGroup.position.x += (targetX - ballGroup.position.x) * 0.15;
            ballGroup.position.z -= speed;
            shell.scale.setScalar(1 + Math.sin(Date.now() * 0.01) * 0.1);
            sideLight.position.copy(ballGroup.position);

            // Camera Bank
            camera.position.set(ballGroup.position.x * 0.5, 3.8, ballGroup.position.z + 10);
            camera.lookAt(ballGroup.position.x, ballGroup.position.y, ballGroup.position.z - 7);
            camera.rotation.z = -(targetX - ballGroup.position.x) * 0.08;

            // Move Grid with Ball
            floorGroup.position.z = ballGroup.position.z - (ballGroup.position.z % 100);

            // Rings
            rings.forEach(r => {
                r.rotation.z += 0.02;
                if (!r.userData.passed && ballGroup.position.z < r.position.z + 0.5) {
                    let dist = Math.sqrt(Math.pow(ballGroup.position.x - r.position.x, 2) + Math.pow(ballGroup.position.y - r.position.y, 2));
                    if (dist < 2.3) {
                        r.userData.passed = true;
                        score += 10; combo++; speed += 0.009;
                        triggerSparkles(r.position);
                        document.getElementById("ui").innerText = score.toString().padStart(4, '0');
                        document.getElementById("combo").innerText = "COMBO X" + combo;
                        r.children[1].material.color.set(0xffffff);
                    } else if (ballGroup.position.z < r.position.z - 0.5) {
                        gameOver = true;
                        document.getElementById("gameOver").style.display = "block";
                        document.getElementById("finalScore").innerText = "SCORE_" + score;
                    }
                }
                if (r.position.z > ballGroup.position.z + 10) {
                    r.position.z -= 350;
                    r.position.x = (Math.random() - 0.5) * 18;
                    r.userData.passed = false;
                    r.children[1].material.color.set(0xff0055);
                }
            });

            particles.forEach(p => {
                if(p.visible) {
                    p.position.add(p.userData.vel);
                    p.scale.multiplyScalar(0.94);
                    if(p.scale.x < 0.05) p.visible = false;
                }
            });

            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
